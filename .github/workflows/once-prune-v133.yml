name: Cancel superseded v1.3.3 candidates
on:
  push:
    branches: [fix/v1.3.3-updater-ru]
    paths: ['.github/workflows/once-prune-v133.yml']
permissions:
  actions: write
  contents: read
jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep latest Russian release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v1.3.3.yml --branch fix/v1.3.3-updater-ru --limit 50 --json databaseId,status)"
          latest="$(jq -r '[.[] | .databaseId] | max // empty' <<<"$runs")"
          test -n "$latest"
          echo "Keep $latest"
          jq -r '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId' <<<"$runs" | while read -r id; do
            if [ "$id" != "$latest" ]; then gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; fi
          done
