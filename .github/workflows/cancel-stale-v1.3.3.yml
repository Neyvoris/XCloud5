name: Stop redundant v1.3.3 translation builds
on:
  push:
    branches:
      - fix/v1.3.3-updater-ru
    paths:
      - '.github/workflows/cancel-stale-v1.3.3.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep newest branch translation build and cancel redundant older ones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-v1.3.3.yml \
            --branch fix/v1.3.3-updater-ru \
            --limit 50 --json databaseId,status)"
          newest="$(jq -r '[.[] | .databaseId] | max // empty' <<<"$runs")"
          test -n "$newest"
          echo "Keeping newest v1.3.3 build: $newest"
          jq -r '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' <<<"$runs" | while read -r id; do
            if [ "$id" != "$newest" ]; then
              echo "Canceling redundant translation build: $id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
