name: Keep only latest v1.3.3 candidate build
on:
  push:
    branches:
      - fix/v1.3.3-updater-ru
    paths:
      - '.github/workflows/cancel-v133-stale.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel-older:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded candidate builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v1.3.3.yml --branch fix/v1.3.3-updater-ru --limit 40 --json databaseId,status)"
          newest="$(jq -r '[.[] | .databaseId] | max // empty' <<<"$runs")"
          test -n "$newest"
          echo "Keeping newest candidate: $newest"
          jq -r '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' <<<"$runs" | while read -r id; do
            if [ "$id" != "$newest" ]; then
              echo "Canceling stale candidate: $id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
