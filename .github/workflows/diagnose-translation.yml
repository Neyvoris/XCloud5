name: Diagnose public translation endpoints (one-shot)
on:
  push:
    branches:
      - fix/v1.3.3-updater-ru
    paths:
      - '.github/workflows/diagnose-translation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check public translation and offline-model endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          urls={
           "google":"https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=Hello%20world",
           "mymemory":"https://api.mymemory.translated.net/get?q=Hello%20world&langpair=en%7Cru",
           "argosindex":"https://raw.githubusercontent.com/argosopentech/argospm-index/main/index.json",
           "argos":"https://www.argosopentech.com/argospm/index/",
           "huggingface":"https://huggingface.co/Helsinki-NLP/opus-mt-en-ru",
          }
          for name,url in urls.items():
           try:
            request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            before=time.monotonic()
            with urllib.request.urlopen(request,timeout=9) as f:
             print(name,"HTTP",f.status,"seconds",round(time.monotonic()-before,1),"body",repr(f.read(110)),flush=True)
           except Exception as e:
            print(name,type(e).__name__,str(e)[:300],flush=True)
          PY
