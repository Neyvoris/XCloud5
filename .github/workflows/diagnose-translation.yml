name: Diagnose public translation endpoints (one-shot)
on:
  push:
    branches:
      - fix/v1.3.3-updater-ru
    paths:
      - '.github/workflows/diagnose-translation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check public translation and offline-model endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          urls={
           "google":"https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=Hello%20world",
           "mymemory":"https://api.mymemory.translated.net/get?q=Hello%20world&langpair=en%7Cru",
           "argosindex":"https://raw.githubusercontent.com/argosopentech/argospm-index/main/index.json",
           "argos":"https://www.argosopentech.com/argospm/index/",
           "huggingface":"https://huggingface.co/Helsinki-NLP/opus-mt-en-ru",
          }
          for name,url in urls.items():
           try:
            request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            before=time.monotonic()
            with urllib.request.urlopen(request,timeout=9) as f:
             print(name,"HTTP",f.status,"seconds",round(time.monotonic()-before,1),"body",repr(f.read(110)),flush=True)
           except Exception as e:
            print(name,type(e).__name__,str(e)[:300],flush=True)
          PY
      - name: Install and run offline Argos English-Russian model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/argos
          /tmp/argos/bin/pip install -q --disable-pip-version-check argostranslate==1.11.0
          /tmp/argos/bin/python - <<'PY'
          import argostranslate.package,argostranslate.translate,time
          t=time.monotonic()
          argostranslate.package.update_package_index()
          packages=argostranslate.package.get_available_packages()
          matches=[p for p in packages if p.from_code=="en" and p.to_code=="ru"]
          print("Argos en-ru model candidates:",len(matches),flush=True)
          assert matches
          model=matches[-1]
          print("Selected:",model,flush=True)
          path=model.download()
          print("Downloaded model to:",path,"seconds",round(time.monotonic()-t,1),flush=True)
          argostranslate.package.install_from_path(path)
          print("Russian:",argostranslate.translate.translate("Your recent games will appear here.","en","ru"),flush=True)
          print("Translate seconds:",round(time.monotonic()-t,1),flush=True)
          PY
